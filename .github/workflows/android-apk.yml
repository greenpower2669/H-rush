name: Ash Rush OMEGA - Android APK de test uniquement
# Google Play différé à la demande de Fab : aucun AAB construit ou publié.
# Les modifications de workflow seules ne déclenchent pas de republication des anciennes Releases.
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/sprites/**'
      - 'assets/audio/**'
      - 'tools/**'
      - 'package.json'
      - 'index.html'
      - 'style.css'
      - 'ash-rush-standalone.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK Android du runner
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1); fi
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Tests scientifiques et de non-régression
        run: npm test
      - name: HTML autonome identique aux sources
        run: |
          npm run build:standalone
          git diff --exit-code -- ash-rush-standalone.html
          python3 - <<'PY'
          from pathlib import Path
          import struct
          png=Path('assets/sprites/atlas.png').read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',png[16:24]) == (1024,1120)
          html=Path('ash-rush-standalone.html').read_text()
          assert 'window.__ASH_RUSH_ATLAS__=' in html
          assert 'class OmegaTerrain' in html
          assert 'class OmegaUniverse' in html
          assert 'function drawOmegaWorld' in html
          assert 'function gateY' in html
          assert 'function finishRun' in html
          assert 'function insertHallEntry' in html
          assert 'id="endReplay"' in html
          assert '<script>' in html
          assert 'import {' not in html.split('<script>')[-1]
          PY
      - name: Embarquer jeu, atlas réellement découpé et WAV SpaceFortress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/assets/assets/{audio/spacefortress,sprites}
          cp ash-rush-standalone.html android-app/app/src/main/assets/ash-rush-standalone.html
          cp assets/sprites/atlas.png android-app/app/src/main/assets/assets/sprites/atlas.png
          cp assets/audio/spacefortress/*.wav android-app/app/src/main/assets/assets/audio/spacefortress/
          test -s android-app/app/src/main/assets/assets/sprites/atlas.png
          test -s android-app/app/src/main/assets/assets/audio/spacefortress/kinetic_release.wav
      - name: Compiler APK de test uniquement
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Contrôler APK, signature, version, ressources et SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=AshRush-Omega-v0.4.1-preview-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='fr.fab.ashrush.omegahall' versionCode='41' versionName='0.4.1'"
          unzip -Z1 "$APK" > /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/ash-rush-standalone.html' /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/assets/sprites/atlas.png' /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/assets/audio/spacefortress/kinetic_release.wav' /tmp/ashrush-omega-entries.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('AshRush-Omega-v0.4.1-preview-debug.apk') as apk:
            html=apk.read('assets/ash-rush-standalone.html')
            assert b'class OmegaTerrain' in html and b'class OmegaUniverse' in html
            assert b'function gateY' in html and b'window.__ASH_RUSH_ATLAS__=' in html
            assert b'function finishRun' in html and b'id="gameOverPanel"' in html
            assert b'function adaptSpecies' in html and b'function insertHallEntry' in html
            assert len(apk.read('assets/assets/sprites/atlas.png')) > 180000
          PY
          test "$(stat -c %s "$APK")" -gt 550000
          sha256sum "$APK" > SHA256SUMS.txt
      - name: Publier uniquement APK direct sur GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.1-omega-preview
          APK=AshRush-Omega-v0.4.1-preview-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" SHA256SUMS.txt \
              --title "Ash Rush OMEGA 0.4.1 - Game Over et Hall of Fame" \
              --notes "OMEGA 0.4.1 : Game Over avec Rejouer et Hall of Fame local, dix meilleurs scores persistants et exportables avec l’univers, 20 archétypes variants selon les mondes, leur phase et la situation. Socle OMEGA conservé : univers par graine cryptographique de 128 bits, zones espace/atmosphère/surface/intérieur, parois mobiles destructibles, masque AND exact, cratères persistants, 20 profils ennemis paramétrés, atlas nettoyé, export/import JSON Android et Web, bande son Space Fortress. APK DEBUG TEST uniquement, package fr.fab.ashrush.omegahall indépendant des anciennes installations pour éviter conflit de signature. Pas encore 40 biomes artistiques distincts ni civilisations autonomes : voir todo.md." \
              --prerelease --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK"
