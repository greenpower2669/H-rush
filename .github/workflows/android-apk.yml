name: Ash Rush - APK Android autonome
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/sprites/**'
      - 'assets/audio/**'
      - 'tools/**'
      - 'package.json'
      - 'index.html'
      - 'style.css'
      - 'ash-rush-standalone.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Utiliser SDK Android présent sur runner
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1); fi
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Valider le moteur, sprites, sauvegarde des parois
        run: npm test
      - name: Reconstituer le HTML autonome pixel-par-pixel identique
        run: |
          npm run build:standalone
          git diff --exit-code -- ash-rush-standalone.html
          test -s assets/sprites/atlas.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('assets/sprites/atlas.png').read_bytes()
          assert p[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',p[16:24]) == (1024,1120)
          html=Path('ash-rush-standalone.html').read_text()
          assert 'data:image/png;base64,' in html
          assert 'class CaveTerrain' in html
          PY
      - name: Copier jeu, sprite atlas et WAV originaux dans APK
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/assets/assets/{audio/spacefortress,sprites}
          cp ash-rush-standalone.html android-app/app/src/main/assets/ash-rush-standalone.html
          cp assets/sprites/atlas.png android-app/app/src/main/assets/assets/sprites/atlas.png
          cp assets/audio/spacefortress/*.wav android-app/app/src/main/assets/assets/audio/spacefortress/
          test -s android-app/app/src/main/assets/assets/sprites/atlas.png
          test -s android-app/app/src/main/assets/assets/audio/spacefortress/kinetic_release.wav
      - name: Compiler APK Android debug
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Vérifier APK, signature, identité, présence réelle des assets
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk AshRush-v0.3.0-asteroid-debug.apk
          APK=AshRush-v0.3.0-asteroid-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='fr.fab.ashrush.cavernpreview' versionCode='30' versionName='0.3.0'"
          unzip -Z1 "$APK" > /tmp/ashrush-apk-files.txt
          grep -Fx 'assets/assets/sprites/atlas.png' /tmp/ashrush-apk-files.txt
          grep -Fx 'assets/assets/audio/spacefortress/kinetic_release.wav' /tmp/ashrush-apk-files.txt
          grep -Fx 'assets/ash-rush-standalone.html' /tmp/ashrush-apk-files.txt
          test "$(stat -c %s "$APK")" -gt 450000
          sha256sum "$APK" > "$APK.sha256"
      - name: Publication APK direct GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.3.0-asteroid-preview
          APK=AshRush-v0.3.0-asteroid-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "Ash Rush 0.3.0 - sprites et cavernes destructibles" \
              --notes "Sprites issus des planches, 23 frames atlas, parois géantes creusables par AND NOT, cratères sauvegardés, sons SpaceFortressVs, paysage multitouch. APK de test signé Android Debug. Package fr.fab.ashrush.cavernpreview séparé pour ne pas casser les anciennes installations ; persistance dans cette installation, non migrée entre packages." \
              --prerelease --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK"
