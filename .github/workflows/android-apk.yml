name: Ash Rush - APK Android autonome
on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'ash-rush-standalone.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Utiliser le SDK préinstallé sur le runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          fi
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          else
            echo "SDK Android 35 et Build Tools 35 déjà disponibles."
          fi
      - name: Tester les collisions et l'entrée tactile
        run: npm test
      - name: Construire le HTML autonome et vérifier la synchronisation
        run: |
          npm run build:standalone
          git diff --exit-code -- ash-rush-standalone.html
      - name: Préparer le HTML embarqué
        run: cp ash-rush-standalone.html android-app/app/src/main/assets/ash-rush-standalone.html
      - name: Compiler APK debug installable
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Vérifier APK, signature et empreinte
        shell: bash
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk AshRush-v0.2.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs AshRush-v0.2.1-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging AshRush-v0.2.1-debug.apk | head -8
          sha256sum AshRush-v0.2.1-debug.apk > AshRush-v0.2.1-debug.apk.sha256
          test -s AshRush-v0.2.1-debug.apk
      - name: Publication directe sur GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.2.1-android-preview
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AshRush-v0.2.1-debug.apk AshRush-v0.2.1-debug.apk.sha256 --clobber
          else
            gh release create "$TAG" AshRush-v0.2.1-debug.apk AshRush-v0.2.1-debug.apk.sha256 \
              --title "Ash Rush 0.2.1 — APK paysage (test)" --notes "APK Android autonome hors ligne, écran paysage, vaisseau à droite du doigt. Signé avec la clé debug du CI : destiné aux essais, pas une version Play Store." --prerelease --target "$GITHUB_SHA"
          fi
