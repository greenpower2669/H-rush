name: Ash Rush OMEGA - Android APK de test uniquement
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'src/**'
      - 'tests/**'
      - 'assets/sprites/**'
      - 'assets/branding/**'
      - 'assets/audio/**'
      - 'tools/**'
      - 'package.json'
      - 'index.html'
      - 'style.css'
      - 'ash-rush-standalone.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK Android du runner
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1); fi
          test -x "$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Tests scientifiques et de non-régression
        run: npm test
      - name: HTML autonome identique aux sources
        run: |
          npm run build:standalone
          git diff --exit-code -- ash-rush-standalone.html
          python3 - <<'PY'
          from pathlib import Path
          import struct
          png=Path('assets/sprites/atlas.png').read_bytes()
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',png[16:24]) == (1024,1120)
          html=Path('ash-rush-standalone.html').read_text()
          assert 'window.__ASH_RUSH_ATLAS__=' in html
          assert 'class OmegaTerrain' in html
          assert 'class OmegaUniverse' in html
          assert 'function drawOmegaWorld' in html
          assert 'function gateY' in html
          assert 'function finishRun' in html
          assert 'function applyHealthDamage' in html
          assert 'class TiltController' in html
          assert 'function createBonusSprites' in html
          assert 'id="welcomeScreen"' in html and 'id="tiltToggle"' in html
          assert 'id="controlMode"' in html and 'id="touchCalibrate"' in html
          assert 'function safeEnemySpawn' in html
          assert 'function insertHallEntry' in html
          assert 'id="endReplay"' in html
          assert '<script>' in html
          assert 'import {' not in html.split('<script>')[-1]
          PY
      - name: Télécharger la musique CC0 depuis les sources publiques et vérifier Djipie
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fetch-djipie-cc0.py
          test -s assets/music/djipie/space_echo.ogg
          test -s assets/music/djipie/battle.mp3
          test -s assets/music/djipie/action_a.mp3
          test -s assets/music/djipie/horror.mp3
      - name: Embarquer jeu, planches, identité H-RUSH et musiques
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/assets/assets/{audio/spacefortress,sprites,music/djipie,branding}
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          # Native Android adaptive icon uses the existing 1024px branding, not a placeholder.
          cp assets/branding/h-rush-icon-1024.png android-app/app/src/main/res/drawable-nodpi/ic_hrush_launcher.png
          cp assets/branding/h-rush-splash-16x9.webp android-app/app/src/main/assets/assets/branding/
          cp assets/branding/h-rush-splash-9x16.webp android-app/app/src/main/assets/assets/branding/
          cp assets/branding/h-rush-icon-original.png android-app/app/src/main/assets/assets/branding/
          cp assets/branding/h-rush-icon-1024.png android-app/app/src/main/assets/assets/branding/
          cp ash-rush-standalone.html android-app/app/src/main/assets/ash-rush-standalone.html
          cp assets/sprites/atlas.png android-app/app/src/main/assets/assets/sprites/atlas.png
          cp assets/audio/spacefortress/*.wav android-app/app/src/main/assets/assets/audio/spacefortress/
          cp assets/music/djipie/* android-app/app/src/main/assets/assets/music/djipie/
          test -s android-app/app/src/main/res/drawable-nodpi/ic_hrush_launcher.png
          test -s android-app/app/src/main/assets/assets/branding/h-rush-splash-16x9.webp
          test -s android-app/app/src/main/assets/assets/sprites/atlas.png
          test -s android-app/app/src/main/assets/assets/audio/spacefortress/kinetic_release.wav
      - name: Compiler APK de test uniquement
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Contrôler APK, signature, version, ressources et SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=AshRush-Omega-v0.4.5-controls-hearts-debug.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -8
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='fr.fab.ashrush.omegacontrols' versionCode='45' versionName='0.4.5'"
          unzip -Z1 "$APK" > /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/ash-rush-standalone.html' /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/assets/sprites/atlas.png' /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/assets/branding/h-rush-splash-16x9.webp' /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/assets/branding/h-rush-splash-9x16.webp' /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/assets/branding/h-rush-icon-original.png' /tmp/ashrush-omega-entries.txt
          grep -E '^res/.+ic_hrush_launcher' /tmp/ashrush-omega-entries.txt
          grep -Fx 'assets/assets/audio/spacefortress/kinetic_release.wav' /tmp/ashrush-omega-entries.txt
          for song in space_echo.ogg action_a.mp3 battle.mp3 horror.mp3; do grep -Fx "assets/assets/music/djipie/$song" /tmp/ashrush-omega-entries.txt; done
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('AshRush-Omega-v0.4.5-controls-hearts-debug.apk') as apk:
            html=apk.read('assets/ash-rush-standalone.html')
            assert b'class OmegaTerrain' in html and b'class OmegaUniverse' in html
            assert b'function gateY' in html and b'window.__ASH_RUSH_ATLAS__=' in html
            assert b'function finishRun' in html and b'id="gameOverPanel"' in html
            assert b'function adaptSpecies' in html and b'function insertHallEntry' in html
            assert b'function sceneMusic' in html and b'function createMusicEngine' in html
            assert b'class TiltController' in html and b'class TouchCalibration' in html
            assert b'function createBonusSprites' in html and b'function grantExtraHeart' in html
            assert b'id="welcomeStart"' in html and b'id="tiltCalibrate"' in html
            assert b'id="controlMode"' in html and b'id="touchCalibrate"' in html
            assert len(apk.read('assets/assets/branding/h-rush-splash-16x9.webp')) > 200000
            assert len(apk.read('assets/assets/branding/h-rush-icon-1024.png')) > 1000000
            assert b'function applyHealthDamage' in html and b'PV_PER_HEART = 4' in html
            assert b'function safeEnemySpawn' in html and b'function advanceEnemyOnTerrain' in html
            assert len(apk.read('assets/assets/sprites/atlas.png')) > 180000
            for filename in ('space_echo.ogg','action_a.mp3','battle.mp3','horror.mp3'):
              assert len(apk.read('assets/assets/music/djipie/'+filename)) > 100000
          PY
          test "$(stat -c %s "$APK")" -gt 5500000
          sha256sum "$APK" > SHA256SUMS.txt
      - name: Publier uniquement APK direct sur GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.5-controls-hearts-preview
          APK=AshRush-Omega-v0.4.5-controls-hearts-debug.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" SHA256SUMS.txt \
              --title "Ash Rush OMEGA 0.4.5 - tactile prioritaire, axes et coeurs bonus" \
              --notes "OMEGA 0.4.5 : tactile selectionne par defaut, bascule tactile/inclinaison, inversion X/Y independante, calibrage tactile par toucher et decalages persistants, inversion des axes compatible inclinaison. 24 bonus visuellement distincts (6 types x 4 formes), coeur extra rare (plafond 8 coeurs) dont les vrais masques de collision dérivent de l'alpha affiché. Accueil 16:9 et icône native extraits des assets/branding de Fab, assets embarqués hors ligne. Cœurs/PV, 11 obstacles mobiles, ennemis et boss soumis au relief AND, 4 musiques CC0 Djipie et sons SpaceFortress, Hall of Fame et univers personnel persistant. APK debug test indépendant, pas de AAB. Configurations et performances du capteur à valider sur Samsung." \
              --prerelease --target "$GITHUB_SHA"
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx "$APK"
